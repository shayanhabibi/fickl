name: Setup .NET
description: Install the .NET SDK pinned by global.json with a cached NuGet package directory.

runs:
  using: composite
  steps:
    - id: global-json
      uses: actions/setup-dotnet@v6
      # A newly announced SDK can be listed before its files reach every download location; the step below
      # then installs the newest SDK of the same band that the release metadata lists.
      continue-on-error: true
      with:
        global-json-file: global.json
        cache: true
        # Package versions also come from .props, which .fsproj files interpolate.
        # restore writes *.nuget.g.props into obj/.
        cache-dependency-path: |
          **/*.fsproj
          **/*.props
          **/*.targets
          .config/dotnet-tools.json
          !**/obj/**

    - id: released
      if: steps.global-json.outcome == 'failure'
      shell: pwsh
      run: |
        $pinned = (Get-Content global.json -Raw | ConvertFrom-Json).sdk.version
        $channel = ($pinned -split '\.')[0..1] -join '.'
        $band = $pinned.Substring(0, $pinned.Length - 2)
        $releases = Invoke-RestMethod "https://builds.dotnet.microsoft.com/dotnet/release-metadata/$channel/releases.json"
        $sdk = $releases.releases.sdks.version | Where-Object { $_ -like "$band*" -and $_ -notlike '*-*' } |
          Sort-Object { [version]$_ } -Descending | Select-Object -First 1
        Write-Host "global.json SDK not installable; using $sdk, the newest released $($band)xx SDK"
        "version=$sdk" >> $env:GITHUB_OUTPUT

    - if: steps.global-json.outcome == 'failure'
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ steps.released.outputs.version }}
        cache: true
        cache-dependency-path: |
          **/*.fsproj
          **/*.props
          **/*.targets
          .config/dotnet-tools.json
          !**/obj/**
