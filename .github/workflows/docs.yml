# fickl: builds the documentation site in docs/ with Nacara and deploys it to GitHub Pages.
# The examples on the site are compiled by the compiler built here, so the site shows what main produces.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - "notes/benchmarks/**"
      - "src/**"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Build the compiler
        run: dotnet build src/Fable.Cli -c Release

      - name: Build the site
        working-directory: docs
        run: dotnet run -c Release -- build

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: docs/output

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
